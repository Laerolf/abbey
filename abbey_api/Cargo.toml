[package]
name = "abbey_api"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1", features = ["v4"] }
rand = { version = "0.8" }
chrono = { version = "0.4.40" }
tokio = "1.45.0"
sqlx-postgres = "0.8.6"
sea-orm = { version = "1.1.11", features = ["sqlx-postgres", "runtime-tokio", "macros"] }
time = "0.3.41"

[dev-dependencies]
cargo-llvm-cov = "0.6.16"
sea-orm-cli = "1.1.11"