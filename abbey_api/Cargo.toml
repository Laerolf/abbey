[package]
name = "abbey_api"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "domain", "api", "migration", "entity"]

[workspace.dependencies]
sea-orm = { version = "1.1.11", features = ["sqlx-postgres", "runtime-tokio", "macros", "debug-print", "mock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[dependencies]
api = { path = "api" }
tokio = { workspace = true }

[dev-dependencies]
sea-orm-cli = "1.1.11"
